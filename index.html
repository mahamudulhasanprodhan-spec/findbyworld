<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Search suppliers country by country across the world&#39;s B2B directories.">
<title>FindByWorld</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head><body>

<section id="home" class="gut">
  <div class="home-inner">
    <a class="logo" href="#">Find<b>By</b>World</a>
    <p class="tag">Search suppliers country by country, across the world's B2B directories.</p>
    <form class="sform" id="f-home" role="search">
      <div class="qbox">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q-home" type="search" placeholder="What product do you need? e.g. bicycles" aria-label="Product" required>
      </div>
      <div class="moq"><label for="m-home">MOQ</label><input id="m-home" type="number" min="1" inputmode="numeric" placeholder="100" aria-label="Minimum order quantity"></div>
      <button class="go" type="submit">Search</button>
    </form>
    <p class="load-error" id="load-error" role="alert" hidden></p>
    <div class="tries">Try:
      <button type="button" data-q="bicycle" data-m="100">bicycle · 100</button>
      <button type="button" data-q="cotton t-shirts" data-m="300">cotton t-shirts · 300</button>
      <button type="button" data-q="leather bags" data-m="50">leather bags · 50</button>
    </div>
    <div class="tries recent" id="recent" hidden></div>
    <p class="foot-note">FindByWorld searches each country's supplier directories for you. Always verify a supplier before you pay.</p>
  </div>
</section>

<section id="results" hidden>
  <div class="top gut">
    <div class="top-row">
      <a class="logo" href="#" id="home-link">Find<b>By</b>World</a>
      <form class="sform" id="f-res" role="search">
        <div class="qbox">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q-res" type="search" aria-label="Product" required>
        </div>
        <div class="moq"><label for="m-res">MOQ</label><input id="m-res" type="number" min="1" inputmode="numeric" placeholder="Any" aria-label="Minimum order quantity"></div>
        <button class="go" type="submit">Search</button>
      </form>
    </div>
  </div>
  <div class="gut">
    <div class="res" id="res"></div>
  </div>
</section>
<div class="toast" id="toast" hidden></div>

<script src="js/links.js"></script>
<script src="js/search.js"></script>
<script src="js/app.js"></script>
</body></html>
